<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Red Filter: night reading without the glare">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060101"/>
      <stop offset="0.6" stop-color="#170403"/>
      <stop offset="1" stop-color="#2a0603"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b14" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#d22300" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d22300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a2c"/>
      <stop offset="1" stop-color="#b01800"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b14" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff3b14" stop-opacity="0"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1280" height="420" fill="#fff"/>
      <circle cx="1062" cy="176" r="118" fill="#000"/>
    </mask>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="210" r="330" fill="url(#glow)"/>

  <!-- rings around the moon -->
  <g fill="none" stroke="#ff3b14">
    <circle cx="1010" cy="210" r="186" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="1010" cy="210" r="232" stroke-opacity="0.13" stroke-width="2"/>
    <circle cx="1010" cy="210" r="284" stroke-opacity="0.07" stroke-width="2"/>
  </g>
  <!-- crescent -->
  <circle cx="1010" cy="210" r="140" fill="url(#moon)" mask="url(#cut)"/>

  <!-- lines of a page, fading out -->
  <g fill="url(#fade)">
    <rect x="84" y="318" width="520" height="6" rx="3"/>
    <rect x="84" y="340" width="430" height="6" rx="3" opacity="0.7"/>
    <rect x="84" y="362" width="300" height="6" rx="3" opacity="0.45"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="176" font-size="104" font-weight="800" letter-spacing="6" fill="#ffe9e1">RED FILTER</text>
    <text x="84" y="232" font-size="32" font-weight="400" fill="#e0a898">Night reading without the glare.</text>
    <g font-size="20" font-weight="600" fill="#ffd2c4">
      <rect x="84" y="262" width="150" height="38" rx="19" fill="#ff3b14" fill-opacity="0.16" stroke="#ff3b14" stroke-opacity="0.55"/>
      <text x="159" y="288" text-anchor="middle">Android 9+</text>
      <rect x="246" y="262" width="110" height="38" rx="19" fill="#ff3b14" fill-opacity="0.16" stroke="#ff3b14" stroke-opacity="0.55"/>
      <text x="301" y="288" text-anchor="middle">21 KB</text>
      <rect x="368" y="262" width="270" height="38" rx="19" fill="#ff3b14" fill-opacity="0.16" stroke="#ff3b14" stroke-opacity="0.55"/>
      <text x="503" y="288" text-anchor="middle">No internet permission</text>
    </g>
  </g>
</svg>
